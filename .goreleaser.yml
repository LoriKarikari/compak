version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: compak
    main: ./cmd/compak
    binary: compak
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/LoriKarikari/compak/internal/cli.version={{.Version}}
      - -X github.com/LoriKarikari/compak/internal/cli.commit={{.Commit}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  github:
    owner: LoriKarikari
    name: compak
  prerelease: auto
